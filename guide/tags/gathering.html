  <p>强度会影响效率</p>

  <p>系数：耐力40力量40灵巧20</p>

  <h3>采矿</h3>
  <p>系数：力量60耐力40</p>
  <p>收集矿物的技能。</p>
  <h3>采摘</h3>
  <p>系数：耐力40灵巧40敏捷20</p>
  <p>采摘作物的技能。</p>
  <h3>钓鱼</h3>
  <p>分为不同的阶段，不同阶段的系数不同</p>
