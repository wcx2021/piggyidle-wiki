<div class="guide-content">
  <h2>侦查</h2>
  <p>生活类技艺，通过侦查可以派遣小猪去得到地图信息</p>
  <p>分为测绘、探索、寻敌、寻宝</p>
  <h3>测绘</h3>
  <p>获取地图残页的技艺。</p>
  <p>系数：智力40耐力20灵巧20感知20</p>
  <p>地图的获取和升级需要消耗地图残页</p>

 <h3>探索</h3>  
  <p>探索地图并定位资源，可以增加地图的资源量</p>
  <p>系数：耐力30感知40灵巧20敏捷10</p>

 <h3>寻敌</h3>
  <p>获取地图威胁度的技能，只能在猎场使用，消耗威胁度可以开启狩猎战场。</p>
  <p>系数：感知60敏捷40</p>

 <h3>寻宝</h3>  
  <p>探索地图并定位宝藏，只能在猎场使用</p>
  <p>系数：耐力30感知60敏捷10</p>
  
</div>
