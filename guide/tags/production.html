  <h2>生产</h2>
  <p class="spaced">生产是与地图资源互动、获取原材料的一系列行为。生产需要有资源的地图才能开始，消耗地图资源量获取对应资源。强度会影响生产效率。</p>

  <h3>基础生产</h3>
  <p class="spaced">通过伐木、采矿、采摘等技艺，小猪可以获取地图上的基础原材料。</p>

  <h4>伐木</h4>
  <p class="spaced">收集木材的技艺。</p>
  <p class="spaced">系数：耐力40 力量40 灵巧20</p>

  <h4>采矿</h4>
  <p class="spaced">收集矿物的技艺。</p>
  <p class="spaced">系数：力量50 耐力50</p>

  <h4>采摘</h4>
  <p class="spaced">采摘作物的技艺。</p>
  <p class="spaced">系数：耐力20 灵巧40 敏捷20 意志20</p>

  <h3>狩猎</h3>

  <h4>狩猎</h4>
  <p class="spaced">在猎场中狩猎野兽，获取毛皮和肉类资源。</p>
  <p class="spaced">系数：力量40 敏捷40 感知20</p>

</div>
