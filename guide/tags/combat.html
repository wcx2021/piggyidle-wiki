<div class="guide-content">
  <h2>战斗</h2>
  <p>目前只构思了狩猎模式、大地图模式和地下城模式</p>
  
  <h3>狩猎模式</h3>
  <p>单人模式，需要拥有猎场。玩家可以派出小猪清除地图上的威胁并且获得经验，每张地图能用数小时到数天不等</p>
  <p>选择地图和对应敌人之后，就能把对应猎场变成战场。每个猎场只能打开一个战场。</p>
  <p>每隔一段时间就会消耗地图的敌人数量，在战场上召唤敌人进入战场</p>

  <h3>大地图模式</h3>
  <p>多人模式，在大地图上挑选搜寻合适的敌人过后消耗讨伐令牌。</p>
  <p>难度较高，有完成奖励，按照参与玩家造成伤害比例分配</p>
  
  <h3>地下城模式</h3>
  <p>多人组队模式，需要消耗地下城令牌进入战斗</p>
  <p>完成后每个参与者都有宝箱奖励</p>
  
</div>
