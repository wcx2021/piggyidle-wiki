<div class="guide-content">
  <h2>制造</h2>
  <p>制造用于把资源转化为物品和装备。</p>
  <h3>锻造</h3>
  <p>系数：</p>
  <p>锻造可以提炼金属打造装备，拥有铸币权的小猪可以把金属打造成钱币。</p>
  <h3>工匠</h3>
  <p>系数：</p>
  <p>工匠可以处理木材打造装备，强大的工匠可以建设小猪建筑。</p>
  <h3>缝纫</h3>
  <p>系数：</p>
  <p>缝纫可以把毛皮和纤维制作成衣物。</p>
  <h3>烹饪</h3>
  <p>系数：</p>
  <p>烹饪可以把可使用资源制作成猪饲料，技艺高超的厨师可以制作特殊的食品。</p>
  <h3>研究</h3>
  <p>系数：</p>
  <p>研究猪可以分析地图线索解锁新的技艺并且制作技艺手册。还可以使用地图碎片合成地图。</p>
  <h3>巫师</h3>
  <p>系数：</p>
  <p>巫师可以使用魔法制作物品和打造装备。还可以回收部分资源。</p>
  </ul>
</div>
